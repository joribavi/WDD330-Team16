<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/checkout.js" type="module"></script>
  </head>
  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider checkout">
      <h2>Checkout</h2>
      <div class="checkout-wrapper">

        <form id="checkout-form" class="checkout-form">

          <fieldset>
            <legend>Customer Name</legend>
            <label for="fname">First Name</label>
            <input type="text" id="fname" name="fname" required placeholder="Jane" />
            <label for="lname">Last Name</label>
            <input type="text" id="lname" name="lname" required placeholder="Doe" />
          </fieldset>

          <fieldset>
            <legend>Address</legend>
            <label for="street">Street Address</label>
            <input type="text" id="street" name="street" required placeholder="123 Main St" />
            <label for="city">City</label>
            <input type="text" id="city" name="city" required placeholder="Rexburg" />
            <label for="state">State</label>
            <input type="text" id="state" name="state" required placeholder="ID" maxlength="2" />
            <label for="zip">Zip Code</label>
            <input type="text" id="zip" name="zip" required placeholder="83440"
              pattern="\d{5}" title="Five digit zip code" />
          </fieldset>

          <fieldset>
            <legend>Payment</legend>
            <label for="cardNumber">Credit Card Number</label>
            <input type="text" id="cardNumber" name="cardNumber" required
              placeholder="1234123412341234" pattern="\d{16}" title="16-digit card number" />
            <label for="expiration">Expiration Date</label>
            <input type="text" id="expiration" name="expiration" required placeholder="8/25" />
            <label for="code">Security Code</label>
            <input type="text" id="code" name="code" required
              placeholder="123" pattern="\d{3,4}" title="3 or 4 digit security code" />
          </fieldset>

          <button type="submit" class="button-checkout">Place Order</button>
        </form>

        <aside class="order-summary" id="order-summary">
          <h3>Order Summary</h3>
          <p>Items (<span id="item-count">0</span>): <span id="subtotal">$0.00</span></p>
          <p>Tax (6%): <span id="tax">$0.00</span></p>
          <p>Shipping: <span id="shipping">$0.00</span></p>
          <p class="order-total">Order Total: <span id="order-total">$0.00</span></p>
        </aside>

      </div>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
